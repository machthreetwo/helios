[project]
name = "helios"
version = "0.1.0"
description = "Solar flare prediction from SHARP magnetic parameters: JSOC/HEK data pipeline with active-region labels and splits"
readme = "README.md"
authors = [
    { name = "Akash", email = "akashkumar052004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "drms",
    "sunpy[net]",
    "pandas",
    "pyarrow",
    "numpy",
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
